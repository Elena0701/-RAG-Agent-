="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#gold)" /><path d="M555 1264 V1421" fill="none" stroke="#224b77" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#blue)" /><path d="M950 1264 V1308" fill="none" stroke="#b54a4a" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#red)" /><path d="M950 1370 V1447 H795" fill="none" stroke="#b54a4a" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#red)" /><path d="M555 1473 V1517" fill="none" stroke="#224b77" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#blue)" /><path d="M775 1552 H1163 V526 H820 V561 H795" fill="none" stroke="#224b77" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#blue)" /><path d="M555 1587 V1631" fill="none" stroke="#224b77" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#blue)" /><path d="M555 1689 V1743" fill="none" stroke="#224b77" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#blue)" /><path d="M755 1660 H850" fill="none" stroke="#b54a4a" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#red)" /><rect x="315" y="152" width="480" height="58" rx="9" fill="#e8f1fb" stroke="#507ca7" stroke-width="1.5" /><text x="555.0" y="176" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" fill="#102e4b" text-anchor="middle">Agent 接收输入与任务规划</text><text x="555.0" y="197" font-family="Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#102e4b" text-anchor="middle">加载配置、业务政策，初始化会话</text><rect x="315" y="254" width="480" height="58" rx="9" fill="#e8f1fb" stroke="#507ca7" stroke-width="1.5" /><text x="555.0" y="278" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" fill="#102e4b" text-anchor="middle">文档预处理与索引构建（RAGTool）</text><text x="555.0" y="299" font-family="Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#102e4b" text-anchor="middle">文档解析、规范化、分块与混合检索索引</text><rect x="850" y="356" width="305" height="52" rx="9" fill="#faeaea" stroke="#b66a6a" stroke-width="1.5" /><text x="1002.5" y="380" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" fill="#783333" text-anchor="middle">FAILED：记录失败原因</text><text x="1002.5" y="401" font-family="Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#783333" text-anchor="middle">输出失败报告，不生成条款结果</text><path d="M555 356 L735 381 L555 406 L375 381 Z" fill="#fff3dd" stroke="#536ca1" stroke-width="1.8" /><text x="555" y="387" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" fill="#12304e" text-anchor="middle">预处理成功？</text><text x="815" y="370" font-family="Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#12304e" text-anchor="middle">否</text><text x="573" y="433" font-family="Noto Sans CJK SC, sans-serif" font-size="13" font-weight="400" fill="#12304e" text-anchor="middle">是</text><rect x="315" y="450" width="480" height="38" rx="9" fill="#e8f1fb" stroke="#507ca7" stroke-width="1.5" /><text x="555.0" y="476" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" fill="#102e4b" text-anchor="middle">生成审查任务清单（41类 / 指定类目）</text><rect x="315" y="532" width="480" height="58" rx="9" fill="#dcefe9" stroke="#65a294" stroke-width="1.5" /><text x="555.0" y="556" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" fill="#102e4b" text-anchor="middle">获取当前审查任务（Task Agent）</text><text x="555.0" y="577" font-family="Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#102e4b" text-anchor="middle">读取任务状态与相关检索历史</text><rect x="315" y="634" width="480" height="58" rx="9" fill="#e8f1fb" stroke="#507ca7" stroke-width="1.5" /><text x="555.0" y="658" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" fill="#102e4b" text-anchor="middle">混合检索（RAGTool）</text><text x="555.0" y="679" font-family="Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#102e4b" text-anchor="middle">结合向量检索与 BM25，获取候选片段</text><rect x="315" y="736" width="480" height="58" rx="9" fill="#e8f1fb" stroke="#507ca7" stroke-width="1.5" /><text x="555.0" y="760" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" fill="#102e4b" text-anchor="middle">条款识别与信息抽取（LLM）</text><text x="555.0" y="781" font-family="Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#102e4b" text-anchor="middle">抽取候选答案与逐字引文</text><rect x="315" y="838" width="480" height="58" rx="9" fill="#e8f1fb" stroke="#507ca7" stroke-width="1.5" /><text x="555.0" y="862" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" fill="#102e4b" text-anchor="middle">证据核验（RAGTool）</text><text x="555.0" y="883" font-family="Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#102e4b" text-anchor="middle">字符偏移、全文语义及候选 No 覆盖检查</text><rect x="315" y="940" width="480" height="58" rx="9" fill="#e8f1fb" stroke="#507ca7" stroke-width="1.5" /><text x="555.0" y="964" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" fill="#102e4b" text-anchor="middle">业务规则审查（RuleTool）</text><text x="555.0" y="985" font-family="Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#102e4b" text-anchor="middle">Q6–Q41 规则审查；Q1–Q5 跳过</text><rect x="850" y="562" width="305" height="118" rx="9" fill="#f7faff" stroke="#7796bc" stroke-width="1.5" stroke-dasharray="6 4" /><text x="1002" y="588" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" fill="#12304e" text-anchor="middle">工具集（Tools）</text><text x="867" y="617" font-family="Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#12304e" text-anchor="start">RAGTool：检索与证据核验</text><text x="867" y="644" font-family="Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#12304e" text-anchor="start">RuleTool：业务规则审查</text><rect x="850" y="726" width="305" height="76" rx="9" fill="#f7faff" stroke="#7796bc" stroke-width="1.5" stroke-dasharray="6 4" /><text x="1002" y="752" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" fill="#12304e" text-anchor="middle">大语言模型（LLM）</text><text x="1002" y="778" font-family="Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#12304e" text-anchor="middle">条款理解、候选答案与引文抽取</text><rect x="850" y="849" width="305" height="161" rx="9" fill="#f7faff" stroke="#7796bc" stroke-width="1.5" stroke-dasharray="6 4" /><text x="1002" y="875" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" fill="#12304e" text-anchor="middle">工作记忆（Memory）</text><text x="866" y="900" font-family="Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#12304e" text-anchor="start">任务状态、检索历史及候选证据</text><text x="866" y="925" font-family="Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#12304e" text-anchor="start">中间结果、核验与规则结果</text><text x="866" y="950" font-family="Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#12304e" text-anchor="start">重试记录、执行日志（JSONL）</text><text x="866" y="975" font-family="Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#12304e" text-anchor="start">持久化断点与中断恢复</text><text x="195" y="1035" font-family="Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#996519" text-anchor="start">重新执行当前任务 / 异常阶段</text><path d="M555 1056 L795 1098 L555 1140 L315 1098 Z" fill="#eeeefa" stroke="#536ca1" stroke-width="1.8" /><text x="555" y="1094" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" fill="#12304e" text-anchor="middle">Agent 反馈决策</text><text x="555" y="1116" font-family="Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#12304e" text-anchor="middle">核验结果 · 规则结果 · 重试次数</text><rect x="190" y="1184" width="226" height="80" rx="9" fill="#fff1d8" stroke="#c49445" stroke-width="1.5" /><text x="303.0" y="1208" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" fill="#82591c" text-anchor="middle">RETRY 重试</text><text x="303.0" y="1229" font-family="Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#82591c" text-anchor="middle">可补查且未达到上限</text><rect x="430" y="1184" width="250" height="80" rx="9" fill="#e1f1e6" stroke="#6ca383" stroke-width="1.5" /><text x="555.0" y="1208" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" fill="#236342" text-anchor="middle">ACCEPT 接受结果</text><text x="555.0" y="1229" font-family="Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#236342" text-anchor="middle">核验通过、无阻塞规则</text><rect x="805" y="1184" width="290" height="80" rx="9" fill="#fae5e5" stroke="#c46a6a" stroke-width="1.5" /><text x="950.0" y="1208" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" fill="#963c3c" text-anchor="middle">ESCALATE 转人工</text><text x="950.0" y="1229" font-family="Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#963c3c" text-anchor="middle">政策要求或重试耗尽</text><rect x="190" y="1308" width="226" height="86" rx="9" fill="#fff1d8" stroke="#c49445" stroke-width="1.5" /><text x="303" y="1333" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="700" fill="#82591c" text-anchor="middle">定向补查 / 阶段重试</text><text x="303" y="1356" font-family="Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#82591c" text-anchor="middle">遗漏证据补取、查询扩展</text><text x="303" y="1378" font-family="Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#82591c" text-anchor="middle">异常阶段复用前序结果</text><rect x="805" y="1308" width="290" height="62" rx="9" fill="#fae5e5" stroke="#c46a6a" stroke-width="1.5" /><text x="950.0" y="1332" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" fill="#963c3c" text-anchor="middle">标记待人工复核</text><text x="950.0" y="1353" font-family="Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#963c3c" text-anchor="middle">保留原因、风险及证据包</text><rect x="315" y="1421" width="480" height="52" rx="9" fill="#e8f1fb" stroke="#507ca7" stroke-width="1.5" /><text x="555.0" y="1445" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" fill="#102e4b" text-anchor="middle">保存任务结果与逐项断点</text><text x="555.0" y="1466" font-family="Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#102e4b" text-anchor="middle">仅接受 / 转人工的终态进入保存</text><path d="M555 1517 L775 1552 L555 1587 L335 1552 Z" fill="#eeeefa" stroke="#536ca1" stroke-width="1.8" /><text x="555" y="1558" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" fill="#12304e" text-anchor="middle">全部任务处理完毕？</text><text x="1045" y="1542" font-family="Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#224b77" text-anchor="middle">否：下一任务</text><text x="573" y="1614" font-family="Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#12304e" text-anchor="middle">是</text><rect x="355" y="1631" width="400" height="58" rx="9" fill="#e8f1fb" stroke="#507ca7" stroke-width="1.5" /><text x="555.0" y="1655" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" fill="#102e4b" text-anchor="middle">Agent 汇总条款结果及待复核事项</text><text x="555.0" y="1676" font-family="Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#102e4b" text-anchor="middle">整合抽取答案、风险评估与原文证据</text><rect x="850" y="1631" width="305" height="58" rx="9" fill="#fae5e5" stroke="#c46a6a" stroke-width="1.5" /><text x="1002.5" y="1655" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" fill="#963c3c" text-anchor="middle">人工复核（Human）</text><text x="1002.5" y="1676" font-family="Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#963c3c" text-anchor="middle">存在待复核事项时移交证据</text><rect x="24" y="1743" width="1152" height="50" rx="12" fill="#e5effa" stroke="#517ba7" stroke-width="1.5" /><rect x="24" y="1743" width="154" height="50" rx="9" fill="#244d82" stroke="12" stroke-width="1.5" /><text x="101" y="1775" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" fill="white" text-anchor="middle">输出结果</text><text x="340" y="1775" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" fill="#12304e" text-anchor="middle">中文终端报告</text><text x="650" y="1775" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" fill="#12304e" text-anchor="middle">JSON 审查报告</text><text x="990" y="1775" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" fill="#12304e" text-anchor="middle">对话记录</text><text x="802.5" y="1648" font-family="Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#963c3c" text-anchor="middle">需要人工复核</text></svg>